apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lostnfound.name" . }}-api
  labels: {{- include "lostnfound.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  CORS_ORIGIN: {{ .Values.api.corsOrigin | quote }}
  AUTH_RATE_LIMIT: {{ .Values.api.authRateLimit | quote }}
  FEATURE_ITEM_SEARCH: {{ .Values.api.features.itemSearch | quote }}
  {{- with .Values.tracing.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  OTEL_SERVICE_NAME: lostnfound-api
  {{- end }}

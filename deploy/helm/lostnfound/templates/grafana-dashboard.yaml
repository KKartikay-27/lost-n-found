{{- if .Values.monitoring.grafanaDashboard }}
# Picked up by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lostnfound.name" . }}-dashboard
  labels:
    {{- include "lostnfound.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  lostnfound.json: |-
{{ .Files.Get "dashboards/lostnfound.json" | indent 4 }}
{{- end }}

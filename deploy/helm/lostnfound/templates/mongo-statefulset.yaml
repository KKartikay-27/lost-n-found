# MongoDB is a StatefulSet: stable identity and a PersistentVolumeClaim that
# survives pod restarts and rescheduling. One replica — this is a single-node
# database, not a replica set (see docs/DECISIONS.md).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lostnfound.name" . }}-mongo
  labels:
    {{- include "lostnfound.labels" . | nindent 4 }}
    {{- include "lostnfound.mongoSelector" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "lostnfound.mongoSelector" . | nindent 4 }}
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lostnfound.name" . }}-mongo
  labels:
    {{- include "lostnfound.labels" . | nindent 4 }}
    {{- include "lostnfound.mongoSelector" . | nindent 4 }}
spec:
  serviceName: {{ include "lostnfound.name" . }}-mongo
  replicas: 1
  selector:
    matchLabels: {{- include "lostnfound.mongoSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "lostnfound.mongoSelector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lostnfound.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          args: ["--bind_ip_all"]
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: MONGO_ROOT_USERNAME } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: MONGO_ROOT_PASSWORD } }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{- toYaml .Values.mongo.resources | nindent 12 }}
          securityContext: {{- include "lostnfound.restrictedSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.mongo.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.storage }}

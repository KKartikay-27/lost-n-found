{{- if .Values.networkPolicy.enabled }}
# Default deny for every pod in the release namespace, then allow only the
# paths the request flow needs: ingress -> api -> mongo, plus scraping and traces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lostnfound.name" . }}-default-deny
  labels: {{- include "lostnfound.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lostnfound.name" . }}-api
  labels: {{- include "lostnfound.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "lostnfound.apiSelector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
        - podSelector:
            matchLabels: { lostnfound-client: "true" }
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "lostnfound.mongoSelector" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 27017 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }} }
      ports:
        - { protocol: TCP, port: 4318 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lostnfound.name" . }}-mongo
  labels: {{- include "lostnfound.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "lostnfound.mongoSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "lostnfound.apiSelector" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 27017 }
{{- end }}

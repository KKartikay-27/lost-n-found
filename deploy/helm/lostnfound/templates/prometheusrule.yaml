{{- if and .Values.monitoring.prometheusRules (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- $errorBudget := sub 1 .Values.monitoring.slo.availability }}
# SLOs: {{ mulf .Values.monitoring.slo.availability 100 }}% of API requests succeed (non-5xx), and
# p95 latency stays under {{ .Values.monitoring.slo.latencyP95Seconds }}s. Each alert links to the runbook step that responds to it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "lostnfound.name" . }}-slo
  labels:
    {{- include "lostnfound.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  groups:
    - name: lostnfound.recording
      rules:
        {{- range list "5m" "1h" }}
        - record: lostnfound:api_error_ratio:rate{{ . }}
          expr: |
            sum(rate(http_request_duration_seconds_count{route=~"/api.*",status=~"5.."}[{{ . }}]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{route=~"/api.*"}[{{ . }}])), 1e-9)
        {{- end }}
        - record: lostnfound:api_latency_p95:5m
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route=~"/api.*"}[5m])))
    - name: lostnfound.alerts
      rules:
        # Multi-window burn rate: fires when the error budget would be gone in ~2 days
        # and the short window confirms it is still happening.
        - alert: LostnfoundErrorBudgetBurn
          expr: |
            lostnfound:api_error_ratio:rate1h > (14.4 * {{ $errorBudget }})
            and
            lostnfound:api_error_ratio:rate5m > (14.4 * {{ $errorBudget }})
          for: 2m
          labels: { severity: page }
          annotations:
            summary: API 5xx ratio is burning the error budget fast
            runbook: docs/RUNBOOK.md#high-error-rate
        - alert: LostnfoundHighLatency
          expr: lostnfound:api_latency_p95:5m > {{ .Values.monitoring.slo.latencyP95Seconds }}
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: API p95 latency above SLO
            runbook: docs/RUNBOOK.md#high-latency
        - alert: LostnfoundApiUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="{{ include "lostnfound.name" . }}-api"} < 1
          for: 2m
          labels: { severity: page }
          annotations:
            summary: No ready API pods
            runbook: docs/RUNBOOK.md#api-unavailable
        - alert: LostnfoundMongoDown
          expr: |
            kube_statefulset_status_replicas_ready{namespace="{{ .Release.Namespace }}",statefulset="{{ include "lostnfound.name" . }}-mongo"} < 1
          for: 2m
          labels: { severity: page }
          annotations:
            summary: MongoDB has no ready replica
            runbook: docs/RUNBOOK.md#mongodb-down
        - alert: LostnfoundPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="api"}[15m]) > 3
          labels: { severity: ticket }
          annotations:
            summary: API container restarting repeatedly
            runbook: docs/RUNBOOK.md#crashloop
{{- end }}

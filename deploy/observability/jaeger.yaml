# Jaeger v2 all-in-one: receives OTLP traces from the API and serves the UI.
# In-memory storage — traces are lost on restart, which is fine for local use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: { app: jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.11.0
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: observability
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
